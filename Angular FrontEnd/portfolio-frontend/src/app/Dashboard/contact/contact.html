<section class="p-5">
<div class="p-5">
              <h2 class="section-title text-center">Messages</h2>

  <div class="p-5">

@for (message of messages; track $index) {
<div class="card m-2" style="width: 18rem;">
  <div class="card-body">
    <h5 class="card-title">{{message.name}}</h5>
    <h6 class="card-subtitle mb-2 text-muted">{{message.email}}</h6>
    <p class="card-text">{{message.message}}</p>
    <a href="#" class="card-link">{{message.phone}}</a>
    <a href="#" class="card-link">Dispaly Message</a>
  </div>
</div>
}
  </div>

</div>
</section>
